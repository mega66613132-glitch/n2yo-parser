name: Daily N2YO Parser

on:
  schedule:
    - cron: '55 15 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Install Python dependencies
      run: |
        pip install pyvirtualdisplay undetected-chromedriver selenium gspread google-api-python-client google-auth

    - name: Create credentials.json
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

    - name: Run Python script
      run: python bot.py
      
    # НОВЫЙ ШАГ: Собираем скриншоты прямо на GitHub
    - name: Upload screenshots to GitHub
      uses: actions/upload-artifact@v4
      if: always() # Этот параметр заставит GitHub собрать скрины даже при ошибках в коде
      with:
        name: cloudflare-screenshots
        path: "*.png"
